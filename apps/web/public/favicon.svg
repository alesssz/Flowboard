<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flowboard mark: an F of three cards. The stem follows the browser's theme; the cards stay amber.
       Colours match the tokens in src/index.css: change them together. -->
  <style>
    .stem { fill: #111827; }
    .card { fill: #f59e0b; }
    @media (prefers-color-scheme: dark) {
      .stem { fill: #f4f4f5; }
      .card { fill: #fbbf24; }
    }
  </style>
  <rect class="stem" x="13" y="8" width="13" height="48" rx="4" />
  <rect class="card" x="30" y="8" width="22" height="13" rx="4" />
  <rect class="card" x="30" y="25" width="17" height="13" rx="4" />
</svg>
