# Weekly updates of the pinned GitHub Actions, in one pull request.
# npm packages are updated by hand; their advisories come from Dependabot alerts and audit.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; the composite action pins actions too.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
