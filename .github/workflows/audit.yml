# pnpm audit, weekly and whenever the dependencies change; any advisory fails the run.
# Advisories fixed by forcing a version are listed in pnpm-workspace.yaml (overrides).
name: Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
  push:
    branches: ['**']
    paths: [package.json, apps/*/package.json, packages/*/package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
  # Fork pull requests only: branches of this repository are audited on push.
  pull_request:
    paths: [package.json, apps/*/package.json, packages/*/package.json, pnpm-lock.yaml, pnpm-workspace.yaml]

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Outdated packages (job summary)
        # Informative only: `pnpm outdated` exits 1 whenever anything is outdated.
        run: |
          {
            echo '### Outdated packages'
            echo '```'
            pnpm outdated --recursive || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit
        run: pnpm audit
