# Type-check, lint and production build, and the API's tests, on every push, on any branch.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels its running build; on main every commit keeps its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First: it also brings the local setup action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # compose.yaml's image; lives only as long as the job, unreachable from outside the runner.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        # The job starts once PostgreSQL accepts connections.
        options: >-
          --health-cmd "pg_isready -U flowboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://flowboard:flowboard@localhost:5432/flowboard_test
    steps:
      # First: it also brings the local setup action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
