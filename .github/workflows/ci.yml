# Type-check, lint and production build on every push, on any branch.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels its running build; on main every commit keeps its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First: it also brings the local setup action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
